services:
  - type: web
    name: griva-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: griva-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://griva-backend.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false          # set manually in Render dashboard
      - key: FIREBASE_CONFIG
        sync: false          # set manually — paste service account JSON (optional, needed for FCM)

databases:
  - name: griva-db
    plan: free
    databaseName: griva_db
    user: griva_db_user
