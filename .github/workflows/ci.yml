name: ABDM HIP Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "abdm/backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "abdm/backend/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: abdm/backend

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint & type check ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: abdm/backend/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check app/

  # ── Unit + integration tests ─────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: abdm_test
          POSTGRES_USER: abdm
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abdm -d abdm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://abdm:testpass@localhost:5432/abdm_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: test-secret-key-must-be-at-least-32-chars-long
      CORS_ORIGINS: http://localhost:5173
      ABDM_TIMESTAMP_TOLERANCE_SECONDS: 60
      TENANT_MASTER_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PLATFORM_IDENTITY_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: abdm/backend/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt pytest-cov

      - name: Run tests
        run: |
          pytest tests/ \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: abdm/backend/coverage.xml

  # ── Docker build check ───────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: abdm/backend
          file: abdm/backend/Dockerfile
          push: false
          tags: griva-abdm-hip:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security scan ────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: abdm/backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for CVEs
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42974

  # ── Deploy (main branch only) ────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: [lint, test, docker-build, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: abdm/backend
          file: abdm/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/griva-abdm-hip:latest
            ${{ secrets.REGISTRY_URL }}/griva-abdm-hip:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Replace this step with your actual deploy mechanism
      # (kubectl rollout, SSH deploy script, ECS update, etc.)
      - name: Trigger deploy
        run: |
          echo "Deploy image ${{ secrets.REGISTRY_URL }}/griva-abdm-hip:${{ github.sha }}"
          echo "Add your deploy command here (kubectl, ssh, ecs, etc.)"
